# The US reader. It is separate from the API and the Bengaluru reader: it deploys nothing. Twice a day it asks the boards
# it follows for their open US roles and keeps them in its own two tables (us_employers, us_roles); without the database
# key it only counts. It also runs when asked, or when the us-reader branch changes. Its counts are left on the
# us-reader-data branch.
name: US reader
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,13 * * *"   # 6:47 am and 6:47 pm in India
  push:
    branches: [us-reader]
    paths: ["us-reader/**", ".github/workflows/us-reader.yml"]
permissions:
  contents: write
concurrency: us-reader
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node us-reader/test.mjs
      - run: node us-reader/discover.mjs || echo "discovery did not finish"
        env: { MAX_BLOCKS: "400" }
      - run: node us-reader/run.mjs
        env:
          LIMIT: "all"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STORE_TEXT: ${{ vars.US_STORE_TEXT }}
      - name: Leave the findings on the us-reader-data branch
        run: |
          mkdir /tmp/out && cp us-reader/out/*.json /tmp/out/
          git config user.name "us-reader" && git config user.email "hello@notaghost.jobs"
          git checkout --orphan us-reader-data && git rm -rfq . && cp /tmp/out/*.json . && git add *.json
          git commit -qm "US reader trial findings" && git push -fq origin us-reader-data
