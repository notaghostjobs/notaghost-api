<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghosted reel</title>
<style>
  /* Ghosted design tokens (ghosted-design skill, 27 Nov 2026). Sizes are for a 1080 x 1920 frame. */
  @font-face { font-family: Outfit; font-weight: 400; src: url(fonts/outfit-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family: Outfit; font-weight: 500; src: url(fonts/outfit-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: Outfit; font-weight: 600; src: url(fonts/outfit-latin-600-normal.woff2) format("woff2"); }
  :root {
    --g-page: #000; --g-card: #111114; --g-control: #3a3a42; --g-divider: #26262c;
    --g-text: #fff; --g-mute: #b4b4bc; --g-faint: #8e8e97;
    --g-green: #37d08c; --g-green-wash: #12261c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--g-page); overflow: hidden; }
  body { font-family: Outfit, sans-serif; color: var(--g-text); -webkit-font-smoothing: antialiased; }
  .brand { position: absolute; left: 80px; top: 170px; display: flex; align-items: center; gap: 24px; }
  .brand img { width: 92px; height: 92px; display: block; }
  .brand span { font-size: 40px; font-weight: 500; letter-spacing: -0.02em; }
  .scene { position: absolute; left: 80px; right: 140px; top: 360px; bottom: 380px; display: flex; flex-direction: column; }
  .label { font-size: 38px; color: var(--g-mute); font-weight: 400; }
  .num { font-size: 260px; font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; font-variant-numeric: tabular-nums; }
  .display { font-size: 92px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.05; }
  .display.mute { color: var(--g-mute); font-weight: 400; }
  .name { font-size: 104px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.02; }
  .role { font-size: 46px; color: var(--g-mute); line-height: 1.3; margin-top: 22px; }
  .count { font-size: 64px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 56px; }
  .checked { font-size: 34px; color: var(--g-faint); margin-top: 18px; display: flex; align-items: center; gap: 14px; }
  .checked svg { width: 34px; height: 34px; }
  .grid { display: grid; grid-template-columns: repeat(5, 118px); gap: 26px; margin-top: 64px; }
  .seat { width: 118px; height: 118px; border-radius: 20px; border: 3px solid var(--g-control);
          display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 600;
          color: var(--g-faint); font-variant-numeric: tabular-nums; }
  .seat.on { background: var(--g-green); border-color: var(--g-green); color: #04130c; }
  .pill { align-self: flex-start; background: var(--g-text); color: #000; border-radius: 999px; height: 150px;
          padding: 0 72px; display: flex; align-items: center; font-size: 66px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { font-size: 48px; color: var(--g-mute); margin-top: 40px; line-height: 1.3; }
  .def { position: absolute; left: 80px; right: 140px; bottom: 400px; font-size: 28px; color: var(--g-faint); line-height: 1.4; }
</style>
</head>
<body>
<div class="brand"><img src="mark.png" alt=""><span>notaghost.jobs</span></div>
<div id="stage"></div>
<script>
/* A deterministic timeline: window.setTime(t) draws the frame at t seconds, so every render is identical.
   Rules kept: the first frame already carries the whole hook; things arrive softly, once
   (fade + rise + 6px blur, 0.7s, cubic-bezier(.2,.8,.2,1)); green appears only on the seats. */
const ease = (x) => { // cubic-bezier(.2,.8,.2,1), close approximation
  x = Math.min(1, Math.max(0, x)); return 1 - Math.pow(1 - x, 3.2);
};
const RISE = 38, BLUR = 6, IN = 0.7, OUT = 0.25;
let D = null, scenes = [];

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function seats(n, numbered) { const g = el("div", "grid"); for (let i = 0; i < n; i++) g.appendChild(el("div", "seat", numbered ? String(i + 1) : "")); return g; }
const tick = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

function build(data) {
  D = data;
  const stage = document.getElementById("stage");
  const add = (start, end, parts, opts = {}) => {
    const s = el("div", "scene"); if (opts.center) s.style.justifyContent = "center"; parts.forEach((p) => s.appendChild(p.node)); stage.appendChild(s);
    scenes.push({ start, end, node: s, parts, ...opts });
  };
  // 1. Hook, fully on screen from frame one; only the seats light up.
  const h = D.hook;
  add(0, 3.2, [
    { node: el("div", "num", String(h.count)), at: -1 },
    { node: el("div", "display", h.line), at: -1 },
    { node: el("div", "display mute", h.sub), at: -1 },
    { node: seats(h.count, false), at: -1, fill: [0.2, 2.2] },
  ], { noIn: true });
  // 2. One company per 2 seconds.
  D.companies.forEach((c, i) => {
    const t0 = 3.2 + i * 2;
    const checked = el("div", "checked"); checked.innerHTML = tick + "<span></span>";
    checked.querySelector("span").textContent = `Checked ${c.checked} on their own careers site`;
    add(t0, t0 + 2, [
      { node: el("div", "label", `${i + 1} of ${D.companies.length}`), at: 0 },
      { node: el("div", "name", c.name), at: 0.05 },
      { node: el("div", "role", c.example), at: 0.15 },
      { node: seats(c.openings, true), at: 0.25, fill: [0.35, 1.2] },
      { node: el("div", "count", `${c.openings} ${c.openings === 1 ? "opening" : "openings"}`), at: 0.3 },
      { node: checked, at: 0.4 },
    ]);
  });
  // 3. The turn: the old way in mute, the Ghosted way in white.
  const t3 = 3.2 + D.companies.length * 2;
  add(t3, t3 + 2.2, [
    { node: el("div", "display mute", D.turn.old), at: 0 },
    { node: Object.assign(el("div", "display", D.turn.new), { style: "margin-top:24px" }), at: 0.35 },
    { node: Object.assign(el("div", "sub", D.send), { style: "margin-top:90px" }), at: 1.0 },
  ], { center: true });
  // 4. The ask, held until the end.
  const t4 = t3 + 2.2;
  add(t4, t4 + 2.6, [
    { node: el("div", "pill", D.cta.pill), at: 0 },
    { node: el("div", "sub", D.cta.sub), at: 0.25 },
  ], { noOut: true, center: true });
  const def = el("div", "def", D.definition); def.id = "def"; document.body.appendChild(def);
  window.DURATION = t4 + 2.6;
}

function setTime(t) {
  for (const s of scenes) {
    const live = t >= s.start && t < s.end + (s.noOut ? 99 : 0);
    s.node.style.display = live ? "flex" : "none";
    if (!live) continue;
    const local = t - s.start;
    const out = s.noOut ? 1 : 1 - ease((t - (s.end - OUT)) / OUT);
    for (const p of s.parts) {
      const k = s.noIn || p.at < 0 ? 1 : ease((local - p.at) / IN);
      p.node.style.opacity = String(k * out);
      p.node.style.transform = `translateY(${(1 - k) * RISE}px)`;
      p.node.style.filter = k < 1 ? `blur(${(1 - k) * BLUR}px)` : "none";
      if (p.fill) {
        const cells = p.node.children, n = cells.length, [a, b] = p.fill;
        const lit = Math.floor(Math.max(0, Math.min(1, (local - a) / (b - a))) * n + 1e-6);
        for (let i = 0; i < n; i++) cells[i].classList.toggle("on", i < lit);
      }
    }
  }
  const def = document.getElementById("def");
  const last = scenes[scenes.length - 1];
  def.style.opacity = String(ease((t - last.start - 0.5) / IN));
}
window.build = build; window.setTime = setTime;
</script>
</body>
</html>
